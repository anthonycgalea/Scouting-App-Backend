name: Deploy FastAPI to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy_api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy FastAPI app to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PASS: ${{ secrets.DO_PASS }}
        run: |
          sshpass -p "$DO_PASS" ssh -o StrictHostKeyChecking=no $DO_USER@$DO_HOST << 'EOF'
            set -e
            echo "🔹 Pulling latest code..."
            cd /opt/Scouting-App-Backend
            git fetch origin main
            git reset --hard origin/main

            echo "🔹 Activating virtual environment..."
            source venv/bin/activate

            echo "🔹 Installing dependencies..."
            pip install -r requirements.txt

            echo "🔹 Restarting FastAPI server in screen session 1349..."
            if screen -list | grep -q "1349"; then
              echo "  ➤ Stopping running process inside screen 1349"
              screen -S 1349 -p 0 -X stuff $'\003'
              sleep 5
            else
              echo "  ➤ Screen 1349 not found, creating it"
              screen -dmS 1349
              sleep 2
            fi

            echo "  ➤ Starting FastAPI server within screen 1349"
            screen -S 1349 -p 0 -X stuff $'cd /opt/Scouting-App-Backend\n'
            screen -S 1349 -p 0 -X stuff $'source venv/bin/activate\n'
            screen -S 1349 -p 0 -X stuff $'uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 3 --proxy-headers\n'

            echo "🔹 Restarting match prediction daemon in screen 39086..."
            if screen -list | grep -q "39086"; then
              echo "  ➤ Stopping running process inside screen 39086"
              screen -S 39086 -p 0 -X stuff $'\003'
              sleep 5
            else
              echo "  ➤ Screen 39086 not found, creating it"
              screen -dmS 39086
              sleep 2
            fi

            echo "  ➤ Starting match prediction daemon within screen 39086"
            screen -S 39086 -p 0 -X stuff $'cd /opt/Scouting-App-Backend\n'
            screen -S 39086 -p 0 -X stuff $'source venv/bin/activate\n'
            screen -S 39086 -p 0 -X stuff $'python -m scripts.run_match_prediction_daemon\n'

            echo "🔹 Restarting daily data sync daemon in screen 47270..."
            if screen -list | grep -q "47270"; then
              echo "  ➤ Stopping running process inside screen 47270"
              screen -S 47270 -p 0 -X stuff $'\003'
              sleep 5
            else
              echo "  ➤ Screen 47270 not found, creating it"
              screen -dmS 47270
              sleep 2
            fi

            echo "  ➤ Starting daily data sync daemon within screen 47270"
            screen -S 47270 -p 0 -X stuff $'cd /opt/Scouting-App-Backend\n'
            screen -S 47270 -p 0 -X stuff $'source venv/bin/activate\n'
            screen -S 47270 -p 0 -X stuff $'python -m scripts.run_daily_data_sync_daemon\n'

            echo "🔹 Restarting ranking prediction daemon in screen 41003..."
            if screen -list | grep -q "41003"; then
              echo "  ➤ Stopping running process inside screen 41003"
              screen -S 41003 -p 0 -X stuff $'\003'
              sleep 5
            else
              echo "  ➤ Screen 41003 not found, creating it"
              screen -dmS 41003
              sleep 2
            fi

            echo "  ➤ Starting ranking prediction daemon within screen 41003"
            screen -S 41003 -p 0 -X stuff $'cd /opt/Scouting-App-Backend\n'
            screen -S 41003 -p 0 -X stuff $'source venv/bin/activate\n'
            screen -S 41003 -p 0 -X stuff $'python -m scripts.run_ranking_prediction_daemon\n'

            echo "🔹 Restarting TBA update daemon in screen 78874..."
            if screen -list | grep -q "78874"; then
              echo "  ➤ Stopping running process inside screen 78874"
              screen -S 78874 -p 0 -X stuff $'\003'
              sleep 5
            else
              echo "  ➤ Screen 78874 not found, creating it"
              screen -dmS 78874
              sleep 2
            fi

            echo "  ➤ Starting TBA update daemon within screen 78874"
            screen -S 78874 -p 0 -X stuff $'cd /opt/Scouting-App-Backend\n'
            screen -S 78874 -p 0 -X stuff $'source venv/bin/activate\n'
            screen -S 78874 -p 0 -X stuff $'python -m scripts.run_tba_update_daemon\n'

            echo "✅ Deployment complete."
          EOF
