name: Deploy FastAPI to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy_api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy FastAPI app to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PASS: ${{ secrets.DO_PASS }}
          DO_SCREEN_ID: ${{ secrets.DO_SCREEN_ID }}
        run: |
          sshpass -p "$DO_PASS" ssh -o StrictHostKeyChecking=no $DO_USER@$DO_HOST << 'EOF'
            set -e
            echo "🔹 Pulling latest code..."
            cd /opt/Scouting-App-Backend
            git fetch origin main
            git reset --hard origin/main

            echo "🔹 Activating virtual environment..."
            source venv/bin/activate

            echo "🔹 Installing dependencies..."
            pip install -r requirements.txt --upgrade

            echo "🔹 Restarting FastAPI server in screen session..."
            if [ -z "$DO_SCREEN_ID" ]; then
              echo "❌ DO_SCREEN_ID secret is not configured."
              exit 1
            fi

            SCREEN_ID="$DO_SCREEN_ID"
            if screen -list | grep -q "$SCREEN_ID"; then
              echo "  ➤ Stopping running process inside screen $SCREEN_ID"
              screen -S "$SCREEN_ID" -p 0 -X stuff $'\003'
              sleep 5
            else
              echo "  ➤ Screen $SCREEN_ID not found, creating it"
              screen -dmS "$SCREEN_ID"
              sleep 2
            fi

            echo "  ➤ Starting FastAPI server within screen $SCREEN_ID"
            screen -S "$SCREEN_ID" -p 0 -X stuff $'cd /opt/Scouting-App-Backend\n'
            screen -S "$SCREEN_ID" -p 0 -X stuff $'source venv/bin/activate\n'
            screen -S "$SCREEN_ID" -p 0 -X stuff $'uvicorn main:app --app-dir app --host 127.0.0.1 --port 8000 --workers 2\n'

            echo "✅ Deployment complete."
          EOF
